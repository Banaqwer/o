[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-engine"
version = "0.1.0"
description = "Adaptive mean-reversion level ladder and reversal engine for index and metals futures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
atm-engine = "atm_engine.cli:main"

[tool.setuptools.packages.find]
include = ["atm_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
